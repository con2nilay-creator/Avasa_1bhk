<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVASA — Kandivali East</title>
<link rel="stylesheet" href="assets/vendor/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Jost,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .maplibregl-ctrl-attrib{font:10px/1.3 Jost,system-ui,sans-serif !important;background:rgba(255,255,255,.72) !important}
  .maplibregl-ctrl-group{box-shadow:0 0 0 1px rgba(42,51,64,.14) !important;border-radius:0 !important}
  #pin{pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:0}
  #pin .lab{font:500 10px Jost,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#8A5238;background:#fff;border:1px solid rgba(192,138,110,.55);padding:6px 10px;white-space:nowrap;box-shadow:0 6px 18px rgba(42,51,64,.14)}
  #pin .stem{width:1px;height:26px;background:#C08A6E}
  #pin .dot{width:9px;height:9px;border-radius:50%;background:#C08A6E;box-shadow:0 0 0 5px rgba(192,138,110,.22)}
</style>
</head>
<body>
<div id="map"></div>
<div id="pin" style="display:none"><div class="lab">AVASA</div><div class="stem"></div><div class="dot"></div></div>
<script src="assets/vendor/maplibre-gl.js"></script>
<script>
var q = new URLSearchParams(location.search);
var lat = parseFloat(q.get('lat') || '19.196639'), lng = parseFloat(q.get('lng') || '72.873472');
var map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [lng, lat],
  zoom: parseFloat(q.get('z') || '16.2'),
  pitch: 58,
  bearing: -18,
  antialias: true,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
var pinEl = document.getElementById('pin');
pinEl.style.display = 'flex';
new maplibregl.Marker({ element: pinEl, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
map.on('load', function () {
  try { map.setPaintProperty('background', 'background-color', '#FFFFFF'); } catch (e) {}
  var layers = map.getStyle().layers || [];
  layers.forEach(function (l) {
    if (l.type === 'fill' && /^(building|landuse|landcover|park)/.test(l.id)) {
      try { map.setPaintProperty(l.id, 'fill-opacity', 0.55); } catch (e) {}
    }
    if (l.id === 'building-3d' || l.id === 'building-top') { try { map.removeLayer(l.id); } catch (e) {} }
  });
  var firstSymbol = (layers.find(function (l) { return l.type === 'symbol'; }) || {}).id;
  map.addLayer({
    id: 'avasa-buildings-3d',
    source: 'openmaptiles',
    'source-layer': 'building',
    type: 'fill-extrusion',
    minzoom: 13,
    paint: {
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8],
        0, '#F3EEE7', 20, '#E7DFD4', 60, '#D9CEBF'
      ],
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.92,
      'fill-extrusion-vertical-gradient': true
    }
  }, firstSymbol);
  map.addSource('avasa-site', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [lng, lat] } } });
  map.addLayer({
    id: 'avasa-site-glow', type: 'circle', source: 'avasa-site',
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 13, 10, 18, 42], 'circle-color': '#C08A6E', 'circle-opacity': 0.16, 'circle-blur': 0.6 }
  });
});
</script>

</body></html>
